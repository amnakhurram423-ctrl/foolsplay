function Card({ theme, children, style, onClick }) {
  return (
    <div onClick={onClick} style={{ background: theme.surface, border: `1px solid ${theme.border}`, borderRadius: theme.radius, ...style }}>
      {children}
    </div>
  );
}

function Button({ theme, children, onClick, variant = "primary", style, disabled, icon: Icon }) {
  const base = {
    display: "inline-flex", alignItems: "center", justifyContent: "center", gap: 8,
    fontFamily: "Inter, sans-serif", fontWeight: 600, fontSize: 14.5, padding: "13px 20px",
    borderRadius: theme.radius === "6px" ? "4px" : "999px", border: "none",
    cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.45 : 1,
    transition: "transform .12s ease, opacity .12s ease, filter .12s ease",
    letterSpacing: theme.name === "Arena" ? "0.03em" : "normal",
  };
  const variants = {
    primary: { background: theme.accent, color: theme.name === "Classroom" ? "#fffdf8" : "#0a0a0a" },
    secondary: { background: theme.surfaceAlt, color: theme.text, border: `1px solid ${theme.border}` },
    ghost: { background: "transparent", color: theme.textDim, border: `1px solid ${theme.border}` },
    danger: { background: "transparent", color: theme.accent2, border: `1px solid ${theme.accent2}55` },
  };
  return (
    <button
      disabled={disabled}
      onClick={onClick}
      onMouseDown={(e) => (e.currentTarget.style.transform = "scale(0.97)")}
      onMouseUp={(e) => (e.currentTarget.style.transform = "scale(1)")}
      style={{ ...base, ...variants[variant], ...style }}
    >
      {Icon && <Icon size={16} strokeWidth={2.4} />}
      {children}
    </button>
  );
}

function genCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "";
  for (let i = 0; i < 5; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}
function genId() {
  return "u" + Math.random().toString(36).slice(2, 8);
}
function stepperBtn(theme, disabled) {
  return { width: 26, height: 26, borderRadius: "50%", border: `1px solid ${theme.border}`, background: theme.surfaceAlt, color: theme.text, display: "flex", alignItems: "center", justifyContent: "center", cursor: disabled ? "not-allowed" : "pointer", opacity: disabled ? 0.35 : 1 };
}

function PlayerSetup({ theme, minPlayers, onStart, gameColor, extraSettings, friends = [], groups = [], initialPlayers = [] }) {
  const [players, setPlayers] = useState(initialPlayers);
  const [name, setName] = useState("");
  const code = useRef(genCode()).current;

  const addPlayer = (nameToAdd) => {
    const n = (nameToAdd ?? name).trim();
    if (!n) return;
    if (players.includes(n)) return;
    setPlayers((p) => [...p, n]);
    if (!nameToAdd) setName("");
  };

  const removePlayer = (i) => setPlayers((p) => p.filter((_, idx) => idx !== i));

  const addGroup = (groupName) => {
    const members = friends.filter((f) => f.groups.includes(groupName)).map((f) => f.name);
    setPlayers((p) => {
      const merged = [...p];
      members.forEach((m) => { if (!merged.includes(m)) merged.push(m); });
      return merged;
    });
  };

  const nonAddedFriends = friends.filter((f) => !players.includes(f.name));
  const groupsWithMembers = groups.filter((g) => friends.some((f) => f.groups.includes(g)));

  return (
    <div>
      <Card theme={theme} style={{ padding: 18, marginBottom: 18, display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <div>
          <div style={{ fontSize: 11, color: theme.textDim, fontFamily: "Inter, sans-serif", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 4 }}>Party code</div>
          <div style={{ fontFamily: theme.font, fontSize: 26, fontWeight: 700, color: gameColor, letterSpacing: "0.1em" }}>{code}</div>
        </div>
        <Copy size={18} color={theme.textDim} style={{ cursor: "pointer" }} />

function RevealCard({ theme, label, sublabel, color, onNext, onPrev, isLast, isFirst }) {
  const [held, setHeld] = useState(false);
  const [flash, setFlash] = useState(false);

  const handleNext = () => {
    setFlash(true);
    setTimeout(() => setFlash(false), 260);
    onNext();
  };
  const handlePrev = () => {
    setFlash(true);
    setTimeout(() => setFlash(false), 260);
    onPrev();
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "10px 0" }}>
      <div style={{ width: "100%", maxWidth: 260, perspective: 1200, position: "relative" }}>
        <div style={{ position: "absolute", inset: 0, borderRadius: theme.radius, background: theme.text, opacity: flash ? 0.3 : 0, transition: "opacity 130ms ease", pointerEvents: "none", zIndex: 5 }} />
        <div
          style={{
            width: "100%", aspectRatio: "220 / 310", position: "relative", userSelect: "none",
            transformStyle: "preserve-3d",
            transform: held ? "rotateY(180deg)" : "rotateY(0deg)",
            transition: "transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275)",
          }}
        >
          <div style={{ position: "absolute", inset: 0, backfaceVisibility: "hidden", background: theme.surfaceAlt, border: `2px solid ${theme.border}`, borderRadius: theme.radius, padding: 16, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 12 }}>
            <div style={{ width: 56, height: 56, borderRadius: "50%", background: theme.surface, border: `1px solid ${theme.border}`, display: "flex", alignItems: "center", justifyContent: "center", color: theme.textDim }}>
              <EyeOff size={24} />
            </div>
            <div style={{ fontFamily: "Inter, sans-serif", fontSize: 13, color: theme.textDim, textAlign: "center", padding: "0 16px" }}>Hold the button below to reveal</div>
          </div>

          <div style={{ position: "absolute", inset: 0, backfaceVisibility: "hidden", transform: "rotateY(180deg)", background: theme.surface, border: `2px solid ${color}`, borderRadius: theme.radius, padding: 20, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 14, textAlign: "center" }}>
            <Eye size={28} color={color} />
            <div style={{ fontFamily: theme.font, fontSize: 24, fontWeight: 700, color: theme.text }}>{label}</div>
            {sublabel && <p style={{ fontSize: 13, color: theme.textDim, margin: 0, lineHeight: 1.4, padding: "0 4px" }}>{sublabel}</p>}
          </div>
        </div>
      </div>

      <div
        onMouseDown={() => setHeld(true)} onMouseUp={() => setHeld(false)} onMouseLeave={() => setHeld(false)}
        onTouchStart={(e) => { e.preventDefault(); setHeld(true); }} onTouchEnd={() => setHeld(false)}
        style={{
          marginTop: 18, width: 60, height: 60, borderRadius: "50%", flexShrink: 0, cursor: "pointer",
          background: held ? color : theme.surface, border: `2px solid ${held ? color : theme.border}`,
          display: "flex", alignItems: "center", justifyContent: "center",
          transition: "background .15s ease, border-color .15s ease", touchAction: "none", userSelect: "none",
        }}
      >
        {held ? <Eye size={22} color={theme.name === "Classroom" ? "#fffdf8" : "#0a0a0a"} /> : <EyeOff size={22} color={theme.textDim} />}
      </div>

      <div style={{ display: "flex", gap: 10, marginTop: 18 }}>
        {onPrev && (
          <Button theme={theme} onClick={handlePrev} variant="ghost" disabled={isFirst} icon={ChevronLeft}>
            Previous
          </Button>
        )}
        <Button theme={theme} onClick={handleNext} variant="secondary" icon={isLast ? Check : ChevronRight}>
          {isLast ? "Everyone's seen it" : "Next player"}
        </Button>
      </div>
    </div>
  );
}

const CUSTOM_ROLE_PALETTE = ["#e5772d", "#00e5c7", "#f7c948", "#9d7cff", "#5cd68c", "#ff9fd6"];

function MafiaGame({ theme, onExit, friends, groups }) {
  const [phase, setPhase] = useState("setup");
  const [players, setPlayers] = useState([]);
  const [roles, setRoles] = useState([]);
  const [idx, setIdx] = useState(0);
  const [mafiaCount, setMafiaCount] = useState(1);
  const [detectiveCount, setDetectiveCount] = useState(1);
  const [customRoles, setCustomRoles] = useState([]);

  const roleColor = { Mafia: "#ff6b6b", Detective: "#7c8cff", Civilian: theme.textDim };
  customRoles.forEach((r, i) => { roleColor[r.name] = CUSTOM_ROLE_PALETTE[i % CUSTOM_ROLE_PALETTE.length]; });

  const start = (playerList) => {
    const specialTotal = mafiaCount + detectiveCount + customRoles.reduce((s, r) => s + r.count, 0);
    const civilians = playerList.length - specialTotal;
    let pool = [
      ...Array(mafiaCount).fill("Mafia"),
      ...Array(detectiveCount).fill("Detective"),
      ...customRoles.flatMap((r) => Array(r.count).fill(r.name)),
      ...Array(Math.max(civilians, 0)).fill("Civilian"),
    ];
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    setPlayers(playerList); setRoles(pool); setPhase("reveal"); setIdx(0);
  };

  if (phase === "setup") {
    return (
      <PlayerSetup
        theme={theme} minPlayers={3} gameColor="#7c8cff" onStart={start} friends={friends} groups={groups} initialPlayers={players}
        extraSettings={(count) => (
          <MafiaSettings theme={theme} playerCount={count} mafia={mafiaCount} detective={detectiveCount} setMafia={setMafiaCount} setDetective={setDetectiveCount} customRoles={customRoles} setCustomRoles={setCustomRoles} />
        )}
      />
    );
  }

  if (phase === "reveal") {
    const isLast = idx === players.length - 1;
    const flavor = { Mafia: "Blend in. Eliminate at night.", Detective: "Investigate one player each night.", Civilian: "Find the mafia before it's too late." };
    return (
      <div>
        <ScreenHeader theme={theme} title={players[idx]} subtitle={`Player ${idx + 1} of ${players.length}`} onBack={() => setPhase("setup")} />
        <RevealCard theme={theme} label={roles[idx]} sublabel={flavor[roles[idx]] || "A special role — ask the host how it works if you're not sure."} color={roleColor[roles[idx]]} isLast={isLast} isFirst={idx === 0} onNext={() => (isLast ? setPhase("done") : setIdx(idx + 1))} onPrev={() => setIdx(Math.max(0, idx - 1))} />
      </div>
    );
  }

  return (
    <div style={{ textAlign: "center", padding: "20px 0" }}>
      <Sparkles size={30} color="#7c8cff" style={{ marginBottom: 14 }} />
      <h2 style={{ fontFamily: theme.font, color: theme.text, marginBottom: 8 }}>Roles are set</h2>
      <p style={{ color: theme.textDim, fontFamily: "Inter, sans-serif", fontSize: 14, marginBottom: 20 }}>The host moderates the night and day phases out loud. Good luck.</p>
      <HostRoleSummary theme={theme} players={players} roles={roles} roleColor={roleColor} />
      <div style={{ display: "flex", gap: 10, justifyContent: "center" }}>
        <Button theme={theme} onClick={() => setPhase("setup")} icon={RotateCcw} variant="secondary">Play again</Button>
        <Button theme={theme} onClick={onExit} icon={Home}>Back to home</Button>
      </div>
    </div>
  );
}

function MafiaSettings({ theme, playerCount, mafia, detective, setMafia, setDetective, customRoles, setCustomRoles }) {
  const [newRoleName, setNewRoleName] = useState("");
  const specialTotal = mafia + detective + customRoles.reduce((s, r) => s + r.count, 0);
  const civilians = Math.max(playerCount - specialTotal, 0);
  const maxMafia = Math.max(playerCount - detective - customRoles.reduce((s, r) => s + r.count, 0) - 1, 1);
  useEffect(() => { if (mafia > maxMafia) setMafia(maxMafia); }, [playerCount, customRoles.length]);

  const addRole = () => {
    const n = newRoleName.trim();
    if (!n) return;
    setCustomRoles((rs) => [...rs, { id: genId(), name: n, count: 1 }]);
    setNewRoleName("");
  };
  const updateRoleCount = (id, delta) => {
    setCustomRoles((rs) => rs.map((r) => (r.id === id ? { ...r, count: Math.max(1, r.count + delta) } : r)));
  };
  const removeRole = (id) => setCustomRoles((rs) => rs.filter((r) => r.id !== id));

  return (
    <Card theme={theme} style={{ padding: 16, marginBottom: 18 }}>
      <div style={{ fontSize: 11, color: theme.textDim, fontFamily: "Inter, sans-serif", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 12 }}>Role ratio</div>
      <RatioRow theme={theme} label="Mafia" value={mafia} onChange={(v) => setMafia(Math.max(1, Math.min(v, maxMafia)))} color="#ff6b6b" />
      <RatioRow theme={theme} label="Detective" value={detective} onChange={(v) => setDetective(Math.max(0, Math.min(v, 1)))} color="#7c8cff" locked />

      {customRoles.map((r, i) => (
        <div key={r.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 4px" }}>
          <span style={{ fontFamily: "Inter, sans-serif", fontSize: 14, color: theme.text }}>{r.name}</span>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button onClick={() => updateRoleCount(r.id, -1)} style={stepperBtn(theme, false)}><Minus size={13} /></button>
            <span style={{ width: 18, textAlign: "center", fontWeight: 700, color: CUSTOM_ROLE_PALETTE[i % CUSTOM_ROLE_PALETTE.length], fontFamily: "Inter, sans-serif" }}>{r.count}</span>
            <button onClick={() => updateRoleCount(r.id, 1)} style={stepperBtn(theme, false)}><Plus size={13} /></button>
            <X size={15} color={theme.textDim} style={{ cursor: "pointer", marginLeft: 2 }} onClick={() => removeRole(r.id)} />
          </div>
        </div>
      ))}

      <div style={{ display: "flex", justifyContent: "space-between", padding: "10px 4px 0", fontFamily: "Inter, sans-serif", fontSize: 13.5, color: theme.textDim }}>
        <span>Civilians</span><span style={{ color: theme.text, fontWeight: 600 }}>{civilians}</span>
      </div>
      {civilians < 1 && <p style={{ color: "#ff6b6b", fontSize: 12, marginTop: 8, fontFamily: "Inter, sans-serif" }}>Add more players or lower the special role count.</p>}

      <div style={{ display: "flex", gap: 8, marginTop: 14, paddingTop: 14, borderTop: `1px solid ${theme.border}` }}>
        <input
          value={newRoleName}
          onChange={(e) => setNewRoleName(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && addRole()}
          placeholder="e.g. Doctor, Jester"
          style={{ flex: 1, background: theme.surfaceAlt, border: `1px solid ${theme.border}`, borderRadius: theme.radius, padding: "9px 12px", color: theme.text, fontFamily: "Inter, sans-serif", fontSize: 13.5, outline: "none" }}
        />
        <Button theme={theme} onClick={addRole} variant="secondary" icon={Plus} style={{ padding: "0 14px", fontSize: 13 }}>Add role</Button>
      </div>
    </Card>
  );
}

function WerewolfGame({ theme, onExit, friends, groups }) {

      <h2 style={{ fontFamily: theme.font, color: theme.text, marginBottom: 8 }}>The moon rises</h2>
      <p style={{ color: theme.textDim, fontFamily: "Inter, sans-serif", fontSize: 14, marginBottom: 20 }}>Host narrates night and day phases out loud, just like Mafia.</p>
      <HostRoleSummary theme={theme} players={players} roles={roles} roleColor={wRoleColor} />

        <Button theme={theme} onClick={() => setPhase("setup")} icon={RotateCcw} variant="secondary">Play again</Button>

function SpinWheel({ theme, players, gameColor, stage, rotation, onSpin }) {
  const n = players.length;
  const segAngle = 360 / n;
  const colors = players.map((_, i) => (i % 2 === 0 ? gameColor : theme.surfaceAlt));
  const gradient = `conic-gradient(${colors.map((c, i) => `${c} ${i * segAngle}deg ${(i + 1) * segAngle}deg`).join(", ")})`;
  const spinning = stage !== "idle";

  const transition =
    stage === "spin" ? "transform 6.5s cubic-bezier(0.1, 0.85, 0.15, 1)" :
    stage === "settle" ? "transform 0.55s cubic-bezier(0.34, 1.2, 0.64, 1)" :
    "none";

  return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", padding: "10px 0" }}>
      <div style={{ position: "relative", width: 240, height: 240, marginBottom: 22 }}>
        <div style={{ position: "absolute", top: -6, left: "50%", transform: "translateX(-50%)", width: 0, height: 0, borderLeft: "9px solid transparent", borderRight: "9px solid transparent", borderTop: `16px solid ${theme.text}`, zIndex: 2 }} />
        <div
          style={{
            width: 240, height: 240, borderRadius: "50%", background: gradient,
            border: `3px solid ${theme.border}`, position: "relative",
            transform: `rotate(${rotation}deg)`,
            transition,
          }}
        >
          {players.map((p, i) => {
            const angle = i * segAngle + segAngle / 2;
            return (
              <div key={i} style={{ position: "absolute", top: "50%", left: "50%", width: 0, height: 0, transform: `rotate(${angle}deg)` }}>
                <span style={{ position: "absolute", left: -40, top: -100, width: 80, textAlign: "center", fontFamily: "Inter, sans-serif", fontSize: 11.5, fontWeight: 700, color: i % 2 === 0 ? (theme.name === "Classroom" ? "#fffdf8" : "#0a0a0a") : theme.text, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                  {p}
                </span>
              </div>
            );
          })}
        </div>
        <div style={{ position: "absolute", top: "50%", left: "50%", width: 42, height: 42, marginTop: -21, marginLeft: -21, borderRadius: "50%", background: theme.surface, border: `2px solid ${theme.border}`, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Shuffle size={16} color={theme.textDim} />
        </div>
      </div>
      <Button theme={theme} onClick={onSpin} disabled={spinning} icon={RotateCcw} style={{ background: gameColor, color: "#1c1310" }}>
        {stage === "spin" ? "Spinning..." : stage === "settle" ? "Almost there..." : "Spin the wheel"}
      </Button>
    </div>
  );
}

function TruthDareGame({ theme, onExit, friends, groups }) {
  const [players, setPlayers] = useState(null);
  const [lastPlayers, setLastPlayers] = useState([]);
  const [phase, setPhase] = useState("wheel");
  const [rotation, setRotation] = useState(0);
  const [spinStage, setSpinStage] = useState("idle");
  const [current, setCurrent] = useState(null);
  const [choice, setChoice] = useState(null);
  const [prompt, setPrompt] = useState("");
  const [used, setUsed] = useState({ truth: [], dare: [] });
  const [round, setRound] = useState(0);
  const spinTimeoutRef = useRef(null);

  useEffect(() => () => clearTimeout(spinTimeoutRef.current), []);

  const spin = () => {
    if (spinStage !== "idle" || !players) return;
    const idx = Math.floor(Math.random() * players.length);
    const segAngle = 360 / players.length;
    const targetMod = (360 - (idx * segAngle + segAngle / 2) + 360) % 360;
    const currentMod = ((rotation % 360) + 360) % 360;
    const additional = ((targetMod - currentMod) + 360) % 360;
    const overshoot = 6;
    setCurrent(players[idx]);
    setSpinStage("spin");
    setRotation(rotation + 360 * 5 + additional + overshoot);
    clearTimeout(spinTimeoutRef.current);
    spinTimeoutRef.current = setTimeout(() => {
      setSpinStage("settle");
      setRotation((r) => r - overshoot);
      spinTimeoutRef.current = setTimeout(() => {
        setSpinStage("idle");
        setPhase("chosen");
      }, 550);
    }, 6500);
  };

  const pick = (type) => {
    const bank = type === "truth" ? TRUTHS : DARES;
    const usedList = used[type];
    let availableIdx = bank.map((_, i) => i).filter((i) => !usedList.includes(i));
    if (availableIdx.length === 0) availableIdx = bank.map((_, i) => i);
    const i = availableIdx[Math.floor(Math.random() * availableIdx.length)];
    setUsed((u) => ({ ...u, [type]: [...u[type], i] }));
    setPrompt(bank[i]); setChoice(type);
  };

  const nextTurn = () => { setChoice(null); setPrompt(""); setRound((r) => r + 1); setPhase("wheel"); };

  if (!players) {
    return (
      <PlayerSetup theme={theme} minPlayers={2} gameColor="#e5772d" friends={friends} groups={groups} initialPlayers={lastPlayers}
        onStart={(list) => { setPlayers(list); setRound(1); setPhase("wheel"); }} />
    );
  }

  return (
    <div>
      <ScreenHeader theme={theme} title="Truth & Dare" subtitle={`Round ${round}`} onBack={() => { setLastPlayers(players); setPlayers(null); }} />
      {phase !== "chosen" ? (
        <SpinWheel theme={theme} players={players} gameColor="#e5772d" stage={spinStage} rotation={rotation} onSpin={spin} />
      ) : (
        <>
          <div style={{ textAlign: "center", marginBottom: 24 }}>
            <div style={{ fontSize: 11, color: theme.textDim, fontFamily: "Inter, sans-serif", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 8 }}>The wheel picked</div>
            <div style={{ fontFamily: theme.font, fontSize: 32, fontWeight: 700, color: "#e5772d" }}>{current}</div>
          </div>
          {!choice ? (
            <div style={{ display: "flex", gap: 12 }}>
              <Button theme={theme} onClick={() => pick("truth")} style={{ flex: 1, padding: "20px", background: theme.surfaceAlt, color: theme.text, border: `1px solid ${theme.border}` }}>Truth</Button>
              <Button theme={theme} onClick={() => pick("dare")} style={{ flex: 1, padding: "20px", background: "#e5772d", color: "#1c1310" }}>Dare</Button>
            </div>
          ) : (
            <Card theme={theme} style={{ padding: 24, textAlign: "center" }}>
              <div style={{ fontSize: 11, color: choice === "dare" ? "#e5772d" : theme.textDim, fontFamily: "Inter, sans-serif", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 12, fontWeight: 700 }}>{choice}</div>
              <p style={{ fontFamily: theme.font, fontSize: 19, color: theme.text, lineHeight: 1.5, margin: 0 }}>{prompt}</p>
            </Card>
          )}
          {choice && <Button theme={theme} onClick={nextTurn} icon={Shuffle} style={{ width: "100%", marginTop: 20, background: "#e5772d", color: "#1c1310" }}>Spin for next player</Button>}
        </>
      )}
    </div>
  );
}

function StoryChainGame({ theme, onExit, friends, groups }) {
  const [players, setPlayers] = useState(null);
  const [lastPlayers, setLastPlayers] = useState([]);
  const [lines, setLines] = useState([]);
  const [turn, setTurn] = useState(0);

    return <PlayerSetup theme={theme} minPlayers={2} gameColor="#ff6b6b" friends={friends} groups={groups} initialPlayers={lastPlayers}

    return (
      <div>

function CodenamesGame({ theme, onExit, friends, groups }) {
  const [players, setPlayers] = useState(null);
  const [lastPlayers, setLastPlayers] = useState([]);
  const [teams, setTeams] = useState({ a: [], b: [] });
  const [board, setBoard] = useState([]);
  const [revealed, setRevealed] = useState([]);
  const [spyView, setSpyView] = useState(false);
  const [turn, setTurn] = useState("a");

  const buildBoard = (list) => {
    const words = [...CODENAMES_WORDS].sort(() => Math.random() - 0.5).slice(0, 20);
    let colors = [...Array(8).fill("a"), ...Array(8).fill("b"), ...Array(3).fill("neutral"), "assassin"];
    colors = colors.sort(() => Math.random() - 0.5);
    setBoard(words.map((w, i) => ({ word: w, color: colors[i] })));
    setRevealed(Array(20).fill(false));
    const half = Math.ceil(list.length / 2);
    setTeams({ a: list.slice(0, half), b: list.slice(half) });
  };

  if (!players) {
    return <PlayerSetup theme={theme} minPlayers={4} gameColor="#00e5c7" friends={friends} groups={groups} initialPlayers={lastPlayers}
      onStart={(list) => { setPlayers(list); buildBoard(list); }} />;
  }

  const tapTile = (i) => {
    if (revealed[i] || spyView) return;
    const next = [...revealed]; next[i] = true; setRevealed(next);
    const tile = board[i];
    if (tile.color === "assassin") return;
    if (tile.color !== turn && tile.color !== "neutral") setTurn(turn === "a" ? "b" : "a");
  };

  const aLeft = board.filter((t, i) => t.color === "a" && !revealed[i]).length;
  const bLeft = board.filter((t, i) => t.color === "b" && !revealed[i]).length;

  return (
    <div>
      <ScreenHeader theme={theme} title="Codenames Party" subtitle={`Team ${turn.toUpperCase()}'s turn`} onBack={() => { setLastPlayers(players); setPlayers(null); }} />

function FriendsScreen({ theme, friends, setFriends, groups, setGroups }) {
  const [handle, setHandle] = useState("");
  const [newGroup, setNewGroup] = useState("");
  const [addingGroupFor, setAddingGroupFor] = useState(null);

  const addFriend = () => {
    const n = handle.trim();
    if (!n) return;
    setFriends((f) => [...f, { id: genId(), name: n, groups: [] }]);
    setHandle("");
  };

  const toggleGroup = (friendId, groupName) => {
    setFriends((fs) => fs.map((f) => {
      if (f.id !== friendId) return f;
      const has = f.groups.includes(groupName);
      return { ...f, groups: has ? f.groups.filter((g) => g !== groupName) : [...f.groups, groupName] };
    }));
  };

  const addCustomGroup = () => {
    const g = newGroup.trim();
    if (!g || groups.includes(g)) return;
    setGroups((gs) => [...gs, g]);
    setNewGroup("");
  };

  const removeFriend = (friendId) => {
    setFriends((fs) => fs.filter((f) => f.id !== friendId));
    if (addingGroupFor === friendId) setAddingGroupFor(null);
  };

  const removeGroup = (groupName) => {
    setGroups((gs) => gs.filter((g) => g !== groupName));
    setFriends((fs) => fs.map((f) => ({ ...f, groups: f.groups.filter((g) => g !== groupName) })));
  };

  return (
    <div>
      <ScreenHeader theme={theme} title="Friends" subtitle={`${friends.length} connected · invite by ID for any game`} />

      <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
        <input value={handle} onChange={(e) => setHandle(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addFriend()} placeholder="Add by username or ID"
          style={{ flex: 1, background: theme.surface, border: `1px solid ${theme.border}`, borderRadius: theme.radius, padding: "13px 16px", color: theme.text, fontFamily: "Inter, sans-serif", fontSize: 14.5, outline: "none" }} />
        <Button theme={theme} icon={UserPlus} onClick={addFriend}>Add</Button>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 22 }}>
        {friends.map((f) => (
          <Card key={f.id} theme={theme} style={{ padding: "13px 16px" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ width: 32, height: 32, borderRadius: "50%", background: theme.accent + "33", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: theme.font, fontSize: 13, fontWeight: 700, color: theme.accent }}>
                  {f.name[0].toUpperCase()}
                </div>
                <div>
                  <div style={{ fontFamily: "Inter, sans-serif", fontSize: 14.5, color: theme.text }}>{f.name}</div>
                  <div style={{ fontFamily: "Inter, sans-serif", fontSize: 10.5, color: theme.textDim }}>#{f.id}</div>
                </div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ width: 8, height: 8, borderRadius: "50%", background: "#5cd68c" }} />
                <button onClick={() => setAddingGroupFor(addingGroupFor === f.id ? null : f.id)} style={{ background: "transparent", border: "none", cursor: "pointer", color: theme.textDim, display: "flex", alignItems: "center", gap: 3, fontSize: 11, fontFamily: "Inter, sans-serif" }}>
                  Groups <ChevronDown size={13} style={{ transform: addingGroupFor === f.id ? "rotate(180deg)" : "none", transition: "transform .15s" }} />
                </button>
                <Trash2 size={15} color={theme.textDim} style={{ cursor: "pointer" }} onClick={() => removeFriend(f.id)} />
              </div>
            </div>
            {f.groups.length > 0 && addingGroupFor !== f.id && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginTop: 8, paddingLeft: 44 }}>
                {f.groups.map((g) => (
                  <span key={g} style={{ fontSize: 10.5, fontFamily: "Inter, sans-serif", color: theme.accent, background: theme.accent + "1a", padding: "2px 8px", borderRadius: "999px" }}>{g}</span>
                ))}
              </div>
            )}
            {addingGroupFor === f.id && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10, paddingTop: 10, borderTop: `1px solid ${theme.border}` }}>
                {groups.map((g) => {
                  const active = f.groups.includes(g);
                  return (
                    <button key={g} onClick={() => toggleGroup(f.id, g)} style={{ padding: "6px 12px", borderRadius: "999px", fontSize: 12, fontFamily: "Inter, sans-serif", fontWeight: 600, border: `1px solid ${active ? theme.accent : theme.border}`, background: active ? theme.accent + "22" : theme.surfaceAlt, color: active ? theme.accent : theme.textDim, cursor: "pointer" }}>
                      {active && "✓ "}{g}
                    </button>
                  );
                })}
              </div>
            )}
          </Card>
        ))}
      </div>

      <div style={{ fontSize: 12, color: theme.textDim, fontFamily: "Inter, sans-serif", letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 10 }}>Groups</div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 10 }}>
        {groups.map((g) => (
          <div key={g} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 10px 8px 13px", borderRadius: "999px", fontSize: 12.5, fontFamily: "Inter, sans-serif", fontWeight: 600, border: `1px solid ${theme.border}`, background: theme.surface, color: theme.text }}>
            {g} · {friends.filter((f) => f.groups.includes(g)).length}
            <Trash2 size={13} color={theme.textDim} style={{ cursor: "pointer" }} onClick={() => removeGroup(g)} />
          </div>
        ))}
      </div>
      <div style={{ display: "flex", gap: 8 }}>
        <input value={newGroup} onChange={(e) => setNewGroup(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addCustomGroup()} placeholder="New group name"
          style={{ flex: 1, background: theme.surface, border: `1px solid ${theme.border}`, borderRadius: theme.radius, padding: "10px 14px", color: theme.text, fontFamily: "Inter, sans-serif", fontSize: 13.5, outline: "none" }} />
        <Button theme={theme} variant="secondary" icon={FolderPlus} onClick={addCustomGroup} style={{ padding: "10px 14px" }}>Create</Button>
      </div>
      <p style={{ fontSize: 11.5, color: theme.textDim, fontFamily: "Inter, sans-serif", marginTop: 14, lineHeight: 1.6 }}>
        When you set up any game, you'll see these groups as one-tap "quick add" buttons that drop everyone in — adjust who's actually playing from there before you start.
      </p>
    </div>
  );
}

const STORAGE_KEY = "partyAppState";

async function loadSavedState() {
  try {
    if (typeof window !== "undefined" && window.storage) {
      const result = await window.storage.get(STORAGE_KEY);
      return result ? JSON.parse(result.value) : null;
    }
    const v = localStorage.getItem(STORAGE_KEY);
    return v ? JSON.parse(v) : null;
  } catch (e) {
    return null;
  }
}

async function saveState(state) {
  const json = JSON.stringify(state);
  try {
    if (typeof window !== "undefined" && window.storage) {
      await window.storage.set(STORAGE_KEY, json);
    } else {
      localStorage.setItem(STORAGE_KEY, json);
    }
  } catch (e) {
  }
}

export default function App() {
  useFonts();
  const [hydrated, setHydrated] = useState(false);
  const [themeKey, setThemeKey] = useState("dark");
  const [tab, setTab] = useState("home");
  const [activeGame, setActiveGame] = useState(null);
  const [ownedGames, setOwnedGames] = useState([]);
  const [friends, setFriends] = useState([
    { id: genId(), name: "Mira", groups: ["Friends"] },
    { id: genId(), name: "Deacon", groups: ["Friends"] },
    { id: genId(), name: "Priya", groups: ["Cousins"] },
  ]);
  const [groups, setGroups] = useState(DEFAULT_GROUPS);
  const theme = THEMES[themeKey];

  useEffect(() => {
    (async () => {
      const saved = await loadSavedState();
      if (saved) {
        if (saved.themeKey) setThemeKey(saved.themeKey);
        if (saved.friends) setFriends(saved.friends);
        if (saved.groups) setGroups(saved.groups);
        if (saved.ownedGames) setOwnedGames(saved.ownedGames);
      }
      setHydrated(true);
    })();
  }, []);

  useEffect(() => {
    if (!hydrated) return;
    saveState({ themeKey, friends, groups, ownedGames });
  }, [hydrated, themeKey, friends, groups, ownedGames]);

  return (
    <div style={{ minHeight: "100vh", background: theme.bgGrad, display: "flex", justifyContent: "center", transition: "background .3s ease", fontFamily: "Inter, sans-serif" }}>
      <div style={{ width: "100%", maxWidth: 430, display: "flex", flexDirection: "column", minHeight: "100vh" }}>
        <div style={{ flex: 1, padding: activeGame ? "28px 20px 20px" : "28px 20px 100px", overflowY: "auto" }}>
          {activeGame ? (
            <GameScreen theme={theme} gameId={activeGame} onExit={() => setActiveGame(null)} friends={friends} groups={groups} />
          ) : tab === "home" ? (
            <HomeScreen theme={theme} onSelectGame={(id) => setActiveGame(id)} ownedGames={ownedGames} />
          ) : tab === "explore" ? (
            <ExploreScreen theme={theme} ownedGames={ownedGames} onGetGame={(id) => setOwnedGames((o) => (o.includes(id) ? o : [...o, id]))} />
          ) : tab === "friends" ? (
            <FriendsScreen theme={theme} friends={friends} setFriends={setFriends} groups={groups} setGroups={setGroups} />
          ) : (
            <SettingsScreen theme={theme} themeKey={themeKey} setThemeKey={setThemeKey} />
          )}
        </div>
        {!activeGame && <NavBar theme={theme} tab={tab} setTab={setTab} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script>
  if (!navigator.onLine) document.getElementById('offline-banner').style.display = 'block';
  window.addEventListener('online', () => { document.getElementById('offline-banner').style.display = 'none'; });
  window.addEventListener('offline', () => { document.getElementById('offline-banner').style.display = 'block'; });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
